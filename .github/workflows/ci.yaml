name: SecureKube CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Linting & Security Tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 safety

    - name: Run Python Code Linting
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings.
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Scan Dependencies for Vulnerabilities
      run: |
        # Scan requirements.txt for known security exploits
        safety check -r app/requirements.txt || echo "Vulnerabilities found, but moving forward for local testing"

    - name: Validate Docker Image Build
      run: |
        cd app
        docker build -t securekube-api:${{ github.sha }} .
