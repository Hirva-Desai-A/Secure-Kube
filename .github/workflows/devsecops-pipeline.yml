name: SecureKube DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read
  id-token: write   # CRITICAL: Required for AWS OIDC authentication

jobs:
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scanning with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Vulnerability scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  build-and-push:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- 1. BUILD WITH v1.1 TAG ---
      - name: Build Docker image
        run: |
          docker build -t securekube-api:v1.1 ./app
          echo "Image built successfully: securekube-api:v1.1"

      # --- 2. SCAN THE v1.1 IMAGE ---
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'securekube-api:v1.1'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Security gate
        run: |
          echo "Security scanning complete. Image is ready for deployment."

      # --- 3. THE AWS OIDC HANDSHAKE ---
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # UPDATE THIS LINE WITH YOUR 12-DIGIT ACCOUNT ID
          role-to-assume: arn:aws:iam::622623003335:role/securekube-github-actions-role 
          # Update to the region you used in aws configure
          aws-region: ap-southeast-1 

      # --- 4. THE VAULT PUSH ---
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push Docker image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: securekube-api
          IMAGE_TAG: v1.1
        run: |
          docker tag securekube-api:v1.1 $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          echo "Success! Scanned image pushed to ECR Vault: $REGISTRY/$REPOSITORY:$IMAGE_TAG"