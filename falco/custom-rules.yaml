customRules:
  securekube_rules.yaml: |-
    - rule: SecureKube Unauthorized Shell Spawn
      desc: Detect shell access or interactive execution inside securekube workloads
      condition: >
        spawned_process and
        container and
        k8s.ns.name = "securekube-app" and
        proc.name in (shell_binaries)
      output: >
        SECUREKUBE INTRUSION ALERT - Unauthorized shell spawned (user=%user.name proc=%proc.name pod=%k8s.pod.name container=%container.name ns=%k8s.ns.name)
      priority: CRITICAL
      tags: [securekube, shell, intrusion, kill_pod]

    - rule: SecureKube Sensitive File Access
      desc: Detect attempts to read credentials or secrets from securekube workloads
      condition: >
        open_read and
        container and
        k8s.ns.name = "securekube-app" and
        fd.name in (/etc/shadow, /etc/passwd, /root/.ssh/id_rsa, /home/*/.ssh/id_rsa, /var/run/secrets/kubernetes.io/serviceaccount/token, /etc/kubernetes/admin.conf)
      output: >
        SECUREKUBE SENSITIVE FILE ACCESS - Potential credential theft (user=%user.name file=%fd.name pod=%k8s.pod.name container=%container.name ns=%k8s.ns.name)
      priority: WARNING
      tags: [securekube, credential, intrusion]

    - rule: SecureKube Suspicious Privilege Change
      desc: Detect sudo or privilege escalation activity inside securekube workloads
      condition: >
        spawned_process and
        container and
        k8s.ns.name = "securekube-app" and
        proc.name in (sudo, su, chpasswd, passwd)
      output: >
        SECUREKUBE PRIVILEGE ALERT - Privilege change activity detected (user=%user.name proc=%proc.name pod=%k8s.pod.name container=%container.name ns=%k8s.ns.name)
      priority: WARNING
      tags: [securekube, privilege, intrusion]
