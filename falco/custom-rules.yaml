customRules:
  securekube_rules.yaml: |-
    - rule: SecureKube Pod Breach
      desc: Kill pod on shell spawn in securekube app
      condition: >
        spawned_process and 
        container and 
        k8s.ns.name = "securekube-app" and 
        container.name = "securekube-api" and 
        proc.name in (shell_binaries)
      output: >
        SECUREKUBE ALERT - Shell spawned (user=%user.name proc=%proc.name) k8s_pod_name=%k8s.pod.name container=%container.name
      priority: CRITICAL
      tags: [securekube, shell, kill_pod]
