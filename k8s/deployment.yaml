apiVersion: apps/v1
kind: Deployment
metadata:
  name: securekube-api
  labels:
    app: securekube-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: securekube-api
  template:
    metadata:
      labels:
        app: securekube-api
    spec:
      containers:
      - name: securekube-api
        image: securekube-api:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10