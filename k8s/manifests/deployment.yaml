apiVersion: apps/v1
kind: Deployment
metadata:
  name: securekube-api
  namespace: securekube-app
spec:
  replicas: 1  # Crucial for local memory optimization
  selector:
    matchLabels:
      app: securekube-api
  template:
    metadata:
      labels:
        app: securekube-api
      annotations:
        # Micro-resource limits for the Istio sidecar proxy
        sidecar.istio.io/proxyCPU: "10m"
        sidecar.istio.io/proxyMemory: "32Mi"
    spec:
      terminationGracePeriodSeconds: 2  # Forces immediate pod eviction to prevent deadlocks
      containers:
        - name: securekube-api
          image: localhost:5000/securekube-api:v3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "50m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10