apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-sa
  namespace: securekube-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: securekube-api
  namespace: securekube-app
spec:
  replicas: 1  # Keep a single replica for local stability
  revisionHistoryLimit: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: securekube-api
  template:
    metadata:
      labels:
        app: securekube-api
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: api-sa
      terminationGracePeriodSeconds: 2  # Forces immediate pod eviction to prevent deadlocks
      containers:
        - name: securekube-api
          # CRITICAL: Point this to your AWS Cloud Vault
          # UPDATE THIS LINE WITH YOUR 12-DIGIT ACCOUNT ID
          image: 622623003335.dkr.ecr.us-east-1.amazonaws.com/securekube-api:v1.1 
          
          # Change to Always so Kubernetes is forced to pull from AWS instead of using your local cache
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
          resources:
            requests:
              memory: "32Mi"  
              cpu: "25m"
            limits:
              memory: "128Mi" 
              cpu: "100m"     
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6