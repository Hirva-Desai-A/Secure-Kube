# 1. Deny everything by default (Already have this)
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: deny-all
  namespace: securekube-app
spec:
  {}
---
# 2. Allow Payment to call API
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-payment-to-api
  namespace: securekube-app
spec:
  selector:
    matchLabels:
      app: securekube-api
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/securekube-app/sa/default"]
      to:
        - operation:
            methods: ["GET"]
            paths: ["/transaction", "/health"]
---
# 3. Allow ONLY API to call Database
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-api-to-db
  namespace: securekube-app
spec:
  selector:
    matchLabels:
      app: securekube-db
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/securekube-app/sa/api-sa"]
      to:
        - operation:
            ports: ["5432"]