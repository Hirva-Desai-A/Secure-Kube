apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-svc
  namespace: securekube-app
spec:
  replicas: 1
  revisionHistoryLimit: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: payment-svc
  template:
    metadata:
      labels:
        app: payment-svc
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: payment-svc
          image: securekube-app2:latest
          imagePullPolicy: IfNotPresent
          # ... keep your ports and resources the same
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              memory: "24Mi"
              cpu: "25m"
            limits:
              memory: "48Mi"
              cpu: "50m"
---
apiVersion: v1
kind: Service
metadata:
  name: payment-svc
  namespace: securekube-app
spec:
  selector:
    app: payment-svc
  ports:
    - port: 80
      targetPort: 8080
