---
# Monitor Falco (if using Falco exporter)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: falco-exporter-monitor
  namespace: securekube-monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - falco
  selector:
    matchLabels:
      app: falco-exporter
  endpoints:
