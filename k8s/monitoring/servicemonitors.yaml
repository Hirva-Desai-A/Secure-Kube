# Monitor hydrasec-api
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: securekube-api-monitor
  namespace: securekube-monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - securekube-app
  selector:
    matchLabels:
      app: securekube-api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s

